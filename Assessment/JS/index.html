<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        xintegrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        xintegrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>

    <!-- Link to CSS file -->
    <link rel="stylesheet" href="/style.css">
</head>

<body class="p-4 p-md-5 min-vh-100">

    <div id="message-box" class="position-fixed top-0 end-0 m-3">

    </div>

    <header class="text-center mb-4 mb-md-5">
        <h1 class="display-6 fw-bold text-dark">Task Manager - User Data</h1>
    </header>

    <main class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="form-container bg-white p-4 p-md-5 shadow">
                    <h2 class="h4 fw-semibold mb-4 text-secondary">Add New Task</h2>

                    <!-- The main form -->
                    <form id="task-form">

                        <!-- User Data Fields -->
                        <fieldset class="border border-primary-subtle p-3 rounded-3 mb-4">
                            <legend class="float-none w-auto px-2 fs-6 fw-medium text-primary">User Credentials</legend>

                            <div class="row">
                                <!-- Name Field -->
                                <div class="col-12 col-md-4 form-group">
                                    <label for="user-name" class="form-label mb-1">Your Name</label>
                                    <input type="text" id="user-name" name="name" class="form-control"
                                        placeholder="3-8 letters only" required pattern="[A-Za-z]{3,8}"
                                        title="Name must be 3 to 8 alphabetic characters (A-Z, a-z).">
                                    <p class="error-message" data-for="name"></p>
                                </div>

                                <!-- Mobile Number Field -->
                                <div class="col-12 col-md-4 form-group">
                                    <label for="user-mobile" class="form-label mb-1">Mobile Number</label>
                                    <input type="tel" id="user-mobile" name="mobile" class="form-control"
                                        placeholder="Starting with 6-9, 10 digits" required pattern="[6-9][0-9]{9}"
                                        title="Mobile number must be 10 digits and start with 6, 7, 8, or 9.">
                                    <p class="error-message" data-for="mobile"></p>
                                </div>

                                <!-- Password Field -->
                                <div class="col-12 col-md-4 form-group">
                                    <label for="user-password" class="form-label mb-1">Password</label>
                                    <input type="password" id="user-password" name="password" class="form-control"
                                        placeholder="Starts with A-Z, 7-12 chars of a-z0-9" required
                                        pattern="[A-Z][a-z0-9]{7,12}"
                                        title="Password must start with an uppercase letter, followed by 7-12 lowercase letters or numbers.">
                                    <p class="error-message" data-for="password"></p>
                                </div>
                            </div>
                        </fieldset>

                        <!-- Task Details -->
                        <fieldset class="border border-primary-subtle p-3 rounded-3 mb-4">
                            <legend class="float-none w-auto px-2 fs-6 fw-medium text-primary">Task Details </legend>

                            <div class="row">
                                <!-- Task Title -->
                                <div class="col-12 form-group">
                                    <label for="task-title" class="form-label mb-1">Task Title</label>
                                    <input type="text" id="task-title" name="taskTitle" class="form-control"
                                        placeholder="Must be at least 5 characters long" required data-minlength="5">
                                    <p class="error-message" data-for="taskTitle"></p>
                                </div>

                                <!-- Description -->
                                <div class="col-12 form-group">
                                    <label for="task-description" class="form-label mb-1">Description</label>
                                    <textarea id="task-description" name="description" class="form-control" rows="3"
                                        placeholder="A detailed description of the task" required
                                        data-minlength="5"></textarea>
                                    <p class="error-message" data-for="description"></p>
                                </div>

                                <!-- Due Date -->
                                <div class="col-12 col-md-6 form-group">
                                    <label for="due-date" class="form-label mb-1">Due Date</label>
                                    <input type="date" id="due-date" name="dueDate" class="form-control" required>
                                    <p class="error-message" data-for="dueDate"></p>
                                </div>

                                <!-- Priority Select -->
                                <div class="col-12 col-md-6 form-group">
                                    <label for="priority" class="form-label mb-1">Priority</label>
                                    <select id="priority" name="priority" class="form-select" required>
                                        <option value="" disabled selected>Select Priority</option>
                                        <option value="High">High</option>
                                        <option value="Medium">Medium</option>
                                        <option value="Low">Low</option>
                                    </select>
                                    <p class="error-message" data-for="priority"></p>
                                </div>

                                <!-- Status Select -->
                                <div class="col-12 form-group">
                                    <label for="status" class="form-label mb-1">Status</label>
                                    <select id="status" name="status" class="form-select" required>
                                        <option value="" disabled selected>Select Status</option>
                                        <option value="To Do">To Do</option>
                                        <option value="In Progress">In Progress</option>
                                        <option value="Done">Done</option>
                                    </select>
                                    <p class="error-message" data-for="status"></p>
                                </div>
                            </div>
                        </fieldset>

                        <!-- Submit Button -->
                        <div class="col-12 mt-3">
                            <button type="submit" class="btn btn-primary btn-lg w-100">
                                <i class="bi bi-save me-2"></i> Save Task
                            </button>
                        </div>
                    </form>

                    <!-- Task List Display Area -->
                    <div class="mt-3 pt-1 border-top">
                        <a href="/view.html" class="btn btn-sm btn-outline-primary mt-3 m-3">
                            Task Viewer
                            <i class="fa fa-arrow-right me-1"></i>
                        </a>
                        <h3 class="h5 fw-semibold mb-4 text-dark">Current Tasks</h3>
                        <div id="task-list-container" class="space-y-3">

                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Link to the custom JavaScript module -->
    <script type="module" src="/Script/app.js"></script>
</body>

</html>
