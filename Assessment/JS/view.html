<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>View Submissions</title>
  <!-- Load Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    xintegrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <!-- Load Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- Load Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    xintegrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>


  <style>
    body {
      background-color: #f7f9fc;
    }

    .view-container {
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 0 10px -5px rgba(0, 0, 0, 0.04);
      border-radius: 1rem;
    }

    .task-row {
      transition: all 0.2s ease-in-out;
    }

    .task-row:hover {
      background-color: #f0f4ff;
    }
  </style>
</head>

<body class="p-4 p-md-5 min-vh-100">

  <main class="container">
    <div class="row justify-content-center">
      <div class="col-lg-10">
        <div class="view-container bg-white p-4 p-md-5 shadow">
          <header class="text-center mb-5">
            <h1 class="display-6 fw-bold text-dark">Task Submissions Viewer</h1>
            <a href="index.html" class="btn btn-sm btn-outline-primary mt-2">
              <i class="bi bi-arrow-left me-1"></i> Go Back to Form
            </a>
          </header>

          <!-- Search Bar and Count -->
          <div class="row mb-4 align-items-center">
            <div class="col-12 col-md-8">
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-search"></i></span>
                <input type="text" id="search-input" class="form-control"
                  placeholder="Search by Task Title or Description">
              </div>
            </div>
            <div class="col-12 col-md-4 text-md-end mt-3 mt-md-0">
              <span id="task-count" class="badge bg-info text-dark fw-bold p-2">0 Tasks Found</span>
            </div>
          </div>

          <!-- Task Table/List Area -->
          <div class="table-responsive">
            <table class="table table-hover align-middle" id="submissions-table">
              <thead class="table-primary">
                <tr>
                  <th scope="col" class="small">#</th>
                  <th scope="col">Title</th>
                  <th scope="col">Priority</th>
                  <th scope="col">Status</th>
                  <th scope="col">Due Date</th>
                  <th scope="col">Actions</th>
                </tr>
              </thead>
              <tbody id="submissions-list">
                <!-- Tasks will be dynamically inserted here -->
              </tbody>
            </table>
          </div>

          <!-- No Data Found Message -->
          <div id="no-data-message" class="alert alert-warning text-center d-none" role="alert">
            <i class="bi bi-exclamation-triangle me-2"></i> No data found. Try relaxing the search filter.
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Link to the custom JavaScript module for the viewer -->
  <script type="module" src="/Script/view_app.js"></script>
</body>

</html>
