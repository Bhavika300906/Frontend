<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h2> 7. Arrays </h2>
    <script>
        let fruits = ["apple", "banana", "cherry"];   // Declare array

        fruits.push("mango");                          // Add a fruit at the end
        fruits.shift();                                // Remove the first fruit

        console.log(fruits);                           // Log the modified array

    </script>
</body>

</html>
