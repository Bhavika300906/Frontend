<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h2>8. Objects</h2>
    <script>
        let car = {
            brand: "Toyota",
            model: "Corolla",
            year: 2018
        };

        // Accessing and printing brand & model
        console.log("Brand: " + car.brand + "<br>");
        console.log("Model: " + car.model + "<br>");

        // Updating the year
        car.year = 2022;

        // Adding a new property
        car.color = "Red";

        console.log(car);   // Print full updated object

    </script>
</body>

</html>
