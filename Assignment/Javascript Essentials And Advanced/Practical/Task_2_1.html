<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h2>2. Variables and Data Types</h2>

    <script>
        // Different data types
        let name = "Bhavika";       // string
        let age = 20;               // number
        let isStudent = true;       // boolean
        let emptyValue = null;      // null
        let notAssigned;            // undefined

        // Logging values and types
        document.write(name + " - " + typeof name + "<br>");
        document.write(age + " - " + typeof age + "<br>");
        document.write(isStudent + " - " + typeof isStudent + "<br>");
        document.write(emptyValue + " - " + typeof emptyValue + "<br>");
        document.write(notAssigned + " - " + typeof notAssigned + "<br>");

    </script>
</body>

</html>
