<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h2>7. Arrays</h2>

    <script>
        let num = [10, 20, 30, 40, 50];
        let sum = 0;

        for (let i = 0; i < num.length; i++) {
            sum += num[i];   // Add each element to sum
        }

        document.write("Total sum: " + sum);
    </script>

</body>

</html>
