<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h2>3. JavaScript Operators</h2><br>
    1. a => 15;<br>
    2. b => 5;<br>
    <br>

    <script>
        let a = 15;
        let b = 5;

        // Arithmetic operations
        document.write("Add: " + (a + b) + "<br>");
        document.write("Subtract: " + (a - b) + "<br>");
        document.write("Multiply: " + (a * b) + "<br>");
        document.write("Divide: " + (a / b) + "<br>");

        // Comparison operators
        document.write("Are a and b equal? " + (a == b) + "<br>");
        document.write("Is a greater than b? " + (a > b) + "<br>");
        // Logical operators
        document.write("Both conditions true? " + (a > 10 && b < 10) + "<br>");

    </script>
</body>

</html>
