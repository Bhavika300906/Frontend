<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h2>5. Loops (For, While, Do-While)</h2>
    <script>
        let num = 1;
        let sum = 0;

        while (num <= 20) {
            if (num % 2 === 0) {     // checks even number
                sum += num;          // add to sum
            }
            num++;                   // increase number
        }

        document.write("Sum of even numbers: " + sum);

    </script>
</body>

</html>
