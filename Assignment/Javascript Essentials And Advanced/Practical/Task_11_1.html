<!DOCTYPE html>
<html>

<head>
    <title>Document</title>
</head>

<body>

    <h2> 11. JavaScript Timing Events - setTimeout</h2>

    <script>
        // Change background color after 5 seconds
        setTimeout(function () {
            document.body.style.backgroundColor = "lightblue";
        }, 5000);
    </script>

</body>

</html>
