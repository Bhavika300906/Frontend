<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</head>


<body>
    <div class="container">
        <div class="row">

        </div>
    </div>
    <script>
        fetch("https://dummyjson.com/products", {
            method: "GET"
        })
            .then(res => {
                return res.json()
            })
            .then((data) => {
                //    console.log(data.products)
                let prodata = data.products.map((products, index) => {
                    console.log(products)
                    return (
                        `
                        <div class="card mb-3 p-5" style="width: 20rem;">
                              <img src=${products.images} class="card-img-top" alt="...">
                         <div class="card-body">
                            <h5 class="card-title">${products.id}</h5>
                            <h5 class="card-title">${products.title}</h5>
                            <p class="card-text">${products.price} $ </p>
                            <p class="card-text">${products.description}...</p>
                            <a href="#" class="btn btn-primary">Go somewhere</a>
                            </div>
                        </div>
         
                    `
                    )
                })

                document.querySelector(".row").innerHTML = prodata.join("")
            })

    </script>

</body>

</html>
