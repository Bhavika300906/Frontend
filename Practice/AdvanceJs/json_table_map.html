<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <table border="5" cellpadding="10">
        <thead>
            <tr>
                <th>Id</th>
                <th>Name</th>
                <th>Email</th>
                <th>City</th>
                <th>zipcode</th>
            </tr>
        </thead>
        <tbody>

        </tbody>
    </table>

    <script>
        fetch("https://fakestoreapi.com/Users", {
            method: "GET"
        })
            .then(res => {
                return res.json()
            })
            .then((res) => {
                let data = res.map((data, index) => {
                    console.log(data)
                    return (
                        `
                        <tr>    
                            <td>${data.id}</td>
                            <td>${data.name.firstname}</td>
                            <td>${data.email}</td>
                            <td>${data.address.city}</td>
                            <td>${data.address.zipcode}</td>
                        </tr>
                    `
                    )
                })
                document.querySelector("tbody").innerHTML = data.join("")
            })
    </script>

</body>

</html>
