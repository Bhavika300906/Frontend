<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <table border="5" cellpadding="10">
        <thead>
            <tr>
                <th>Id</th>
                <th>Name</th>
                <th>Email</th>
                <th>City</th>
                <th>Company</th>
            </tr>
        </thead>
        <tbody>

        </tbody>
    </table>


    <script>
        fetch("https://fakestoreapi.com/Users", {
            method: "GET"
        })
            .then(res => {
                return res.json()
            })
            .then((data) => {
                console.log(data)
                for (let element of data) {
                    console.log(element)
                    let tbody = document.querySelector("tbody")
                    let trow = tbody.insertRow();
                    let idcell = trow.insertCell(0)
                    let namecell = trow.insertCell(1)
                    let emailcell = trow.insertCell(2)
                    let citycell = trow.insertCell(3)
                    let zipcode = trow.insertCell(4)

                    idcell.innerText = element.id;
                    namecell.innerText = element.name.firstname + " " + element.name.lastname;
                    emailcell.innerText = element.email;
                    citycell.innerText = element.address.city;
                    zipcode.innerText = element.address.zipcode;  
                    console.log(data);
                }
            })

    </script>
</body>

</html>
