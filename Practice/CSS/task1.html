<!DOCTYPE html>
<html>

<head>
    <style>
        .outer {
    
            margin: 10% 40%;
            display: inline-block;
            padding: 5px;
            border: 3px solid transparent;      /* invisible border first */
            /* transition: 0.5s; */
        }

        .outer:hover {
            border-color: aqua;   /* border appears */
            padding: 15px;         /* expands outside */
        }

        .btn {
            background: aqua;
            color: black;
            font-size: 18px;
            padding: 12px 30px;
            cursor: pointer;
            transform: scale(1.1);
            transition: 0.5s;
        }
    </style>
</head>

<body>

    <div class="outer">
        <div class="btn">Shop Now</div>
    </div>

</body>

</html>
