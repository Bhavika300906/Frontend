<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 4</title>
</head>

<body>
    <script>
        //Task 4 - Create a function that is odd and even using loops within the range of 1 to 100 and print the result to the console.
        function oddEven() {
            for (let i = 1; i <= 100; i++) {
                if (i % 2 === 0) {
                    document.write(i + " is even<br>");
                } else {
                    document.write(i + " is odd<br>");
                }
            }
        }
        oddEven();

    </script>
</body>

</html>
