<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 2</title>
</head>

<body>
    <script>
        switch (2) {
            case 1:
                dayName = "Sunday";
                document.write("Today is " + dayName);
                break;
            case 2:
                dayName = "Monday";
                document.write("Today is " + dayName);
                break;
            case 3:
                dayName = "Tuesday";
                document.write("Today is " + dayName);
                break;
            case 4:
                dayName = "Wednesday";
                document.write("Today is " + dayName);
                break;
            case 5:
                dayName = "Thursday";
                document.write("Today is " + dayName);
                break;
            case 6:
                dayName = "Friday";
                document.write("Today is " + dayName);
                break;
            case 7:
                dayName = "Saturday";
                document.write("Today is " + dayName);
                break;
            default:
                dayName = "Invalid Day";
                document.write(dayName);
        }

    </script>
</body>

</html>
