    <h1>Task 3</h1>

    <script>
        for (let i = 1; i <= 5; i++) {
            for (let j = 1; j <= i; j++) {
                document.write(j);
            }
            document.write("<br>");
        }
        for (let i = 5; i >= 1; i--) {
            for (let j = 5; j >= i; j--) {
                document.write(j);
            }
            document.write("<br>");
        }
        for (let i = 1; i <= 5; i++) {

        for (let i = 1; i >= 5; i--) {
            for (let j = 5; j >= i; j--) {
                document.write(i);
            }
            document.write("<br>");
        }
